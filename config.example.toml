# copy to config.toml and fill in. config.toml is gitignored.

token = "your bot token"

# discord user ids. ops can do everything, friends can only look.
op_ids = [123456789012345678]
friend_ids = []

# battery % at or below which a device shows the low icon
low_battery = 20

# private key the bot uses to ssh into the other pcs (its .pub goes on each of them).
# /host pair makes it if it's missing. this is the default:
# ssh_key = 'C:\Users\you\.ssh\tundra_remote'
# for pcs listed below: check host keys against ~/.ssh/known_hosts. ssh into each one once by hand to add it.
# pcs added with /host pair have their host key pinned instead.
ssh_strict = true

# /host pair serves the setup script on this port, on the bot pc's tailnet ip, only while a code is waiting
pair_port = 8765

# the pc the bot runs on is always included as "this-pc" (/host unpair takes it off, /host pair local
# brings it back). to pin it here instead, so it can't be taken off from discord:
# [[hosts]]
# name = "desk"
# local = true

# other pcs are easiest to add with /host pair, which keeps them in data.json.
# or set one up by hand with scripts/install-remote.ps1 -PublicKey and list it here:
# [[hosts]]
# name = "laptop"
# tailnet_host = "laptop"          # magicdns name or 100.x.y.z
# ssh_user = "you"
# python = 'C:\Python314\python.exe'
# remote_dir = 'C:\Users\you\AppData\Local\tundra-remote\app'   # this is the default
